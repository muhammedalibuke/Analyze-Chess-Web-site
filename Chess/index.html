<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satranç Analizi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap" id="mainWrap">
  <header class="masthead" id="mainHeader">
    <h1>Satranç İncelemesi</h1>
    <p class="subtitle">PGN'ini yükle </p>
  </header>
  <div class="setup-panel" id="mainSetupPanel">
    <div class="tabs-nav">
      <button class="tab-btn active" id="tabFileBtn">📂 Dosya Yükle</button>
      <button class="tab-btn" id="tabTextBtn">📝 Metin Olarak Yapıştır</button>
    </div>
    <div class="tab-content active" id="contentFile">
      <label class="dropzone-area" for="pgnFile" id="dropzoneLabel">
        <span class="dropzone-icon">☁️</span>
        <span class="dropzone-text">PGN dosyanızı <b>buraya sürükleyin</b> veya tıklayarak <b>seçin</b></span>
        <span class="file-status-text" id="fileStatusText"></span>
      </label>
      <input type="file" id="pgnFile" accept=".pgn" style="display: none;">
    </div>
    <div class="tab-content" id="contentText">
      <textarea id="pgnInput" class="w-full h-40 bg-[#111c2a] border border-gray-800 rounded-lg p-3 text-sm text-gray-200 font-mono focus:outline-none focus:border-blue-500 transition-colors resize-none mb-4" placeholder="1. e4 e5 2. Nf3... veya PGN metnini buraya yapıştırın..."></textarea>
    </div>
    <div class="config-row">
      <div class="select-group">
        <span class="setup-label">Hangi renkle oynadın?</span>
        <select id="colorSelect">
          <option value="auto" selected>Farketmez</option>
          <option value="white">Beyaz</option>
          <option value="black">Siyah</option>
        </select>
      </div>
    </div>
    <div class="setup-actions">
      <button class="btn btn-primary" id="analyzeBtn">Analiz Et</button>
      <button class="btn btn-ghost" id="sampleBtn">Örnek Parti Yükle</button>
    </div>
    <div class="status-row" id="statusRow">
      <div id="statusLine">Hazırlanıyor…</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="review-layout" id="reviewLayout">
    <div class="board-col">
      <div class="board-frame">
        <div class="board-mat">
          <div class="frame-coord-row top" id="coordsTop"></div>
          <div class="frame-coord-row bottom" id="coordsBottom"></div>
          <div class="frame-coord-col left" id="coordsLeft"></div>
          <div class="frame-coord-col right" id="coordsRight"></div>
          <div class="board-outer">
            <div id="board"></div>
            <svg id="arrowOverlay" viewBox="0 0 480 480"></svg>
          </div>
        </div>
      </div>
      <div class="board-controls">
        <button class="nav-btn" id="prevBtn" aria-label="Önceki hamle">◀</button>
        <span id="plyLabel">Başlangıç konumu</span>
        <button class="nav-btn" id="nextBtn" aria-label="Sonraki hamle">▶</button>
      </div>
    </div>

    <div class="side-col analysis-col">
      <div class="info-card">
        <button class="btn btn-ghost" id="backToSetupBtn" style="width: 100%;">🔙 Yeni Maç Analiz Et</button>
      </div>

      <!-- Açılış Teorisi Kartı -->
      <div class="info-card" id="openingCard" style="display: none;">
        <h3 class="info-card-title">📖 Açılış Teorisi</h3>
        <div id="openingNameText" style="font-size: 14px; font-weight: 500; color: var(--text-primary); margin-top: 6px; line-height: 1.4;">—</div>
      </div>

      <div class="info-card movelist-card">
        <h3 class="info-card-title">📋 Hamle Listesi</h3>
        <div class="move-list" id="moveList"></div>
      </div>

      <!-- Hamle Açıklama Kartı (Engine Commentary) -->
      <div id="commentaryCard" class="info-card" style="display: none;">
        <div class="flex items-center gap-2 mb-2">
          <span id="commBadge" class="px-2 py-0.5 rounded text-xs font-bold flex items-center justify-center"></span>
          <span id="commTitle" class="text-white font-semibold text-sm"></span>
        </div>
        <p id="commText" class="text-gray-400 text-xs leading-relaxed mb-3"></p>
        <div id="commPvContainer" class="bg-[#111c2a] rounded p-2 border border-gray-900 hidden">
          <span class="text-gray-500 text-[9px] uppercase font-bold block mb-1">En İyi Devam Yolu (Varyant):</span>
          <p id="commPvText" class="font-mono text-xs text-gray-300 tracking-tight leading-relaxed"></p>
        </div>
      </div>

      <div class="info-card" id="accuracyCard">
        <h3 class="info-card-title">🎯 Doğruluk</h3>
        <div class="accuracy-row">
          <div class="accuracy-box"><span class="acc-label">Beyaz</span><span class="acc-value" id="whiteAcc">—</span></div>
          <div class="accuracy-box"><span class="acc-label">Siyah</span><span class="acc-value" id="blackAcc">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="note" id="mainFooter">
  </footer>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
